  const reset=s=>{if(s!==w)return;w=null;q.length=0;try{s.close()}catch(e){}P.forEach(p=>{clearTimeout(p.t);p.no(new Error('ws closed'))});P.clear()};

    P.set(id,{ok,no,t:setTimeout(()=>{P.delete(id);no(new Error('ws timeout'));reset(s)},ms||12000)});
    s.readyState===1?s.send(msg):q.push(msg);

}

  const mid=midP,lo=mid*(1-S.range/100),hi=mid*(1+S.range/100);
  let ext=0;prof.forEach(w=>{ext=Math.max(ext,Math.abs(w.p-mid))});
  const pct=S.lg||NICE.find(v=>v>=ext/mid*100/28)||5,stp=nicePx(mid*pct/100),dec=Math.max(0,Math.min(8,Math.ceil(-Math.log10(stp)-1e-9)));
  const agg=(book,side)=>{const m=new Map();let tot=0;
    book.forEach((q,p)=>{p=+p;if(p<lo||p>hi)return;const u=p*q,k=side==='b'?Math.floor(p/stp):Math.ceil(p/stp),o=m.get(k);
      if(o){o.usd+=u;o.q+=q}else m.set(k,{p:k*stp,usd:u,q,side});if(Math.abs(p/mid-1)<.01)tot+=u});
    return {rows:[...m.values()],tot}};
  const A=agg(asks,'a'),B=agg(bids,'b');
  const ra=A.rows.sort((x,y)=>x.p-y.p).slice(0,90),rb=B.rows.sort((x,y)=>y.p-x.p).slice(0,90);
  const maxU=Math.max(1,...ra.map(w=>w.usd),...rb.map(w=>w.usd));
  const top3=a=>new Set(a.slice().sort((x,y)=>y.usd-x.usd).slice(0,3).map(w=>w.p)),ka=top3(ra),kb=top3(rb);
  const row=(w,k)=>{const d=(w.p/mid-1)*100;return '<div class="r '+w.side+(k.has(w.p)?' k':'')+'" data-p="'+w.p+'" data-u="'+w.usd+'" data-s="'+w.side+'" style="--w:'+Math.max(3,100*w.usd/maxU).toFixed(1)+'%"><span>'+w.p.toFixed(dec)+'</span><i>'+(d>=0?'+':'')+d.toFixed(2)+'%</i><b>'+fmt(w.usd)+'</b></div>'};
  const sa=$('#lsa'),sb=$('#lsb'),sm=$('#smid'),ha=ra.map(w=>row(w,ka)).join(''),hb=rb.map(w=>row(w,kb)).join('');
  if(sa._h!==ha){const t=sa.scrollTop;sa.innerHTML=ha;sa._h=ha;sa.scrollTop=t}
  if(sb._h!==hb){const t=sb.scrollTop;sb.innerHTML=hb;sb._h=hb;sb.scrollTop=t}
  if(!sideInit){sa.scrollTop=0;sb.scrollTop=0;sideInit=true}
  const tb=B.tot,ta=A.tot,sh=tb+ta?100*tb/(tb+ta):50;
  const mh='<b>'+mid.toFixed(prec)+'</b><small>спред '+(bestA-bestB).toFixed(prec)+' · в ±1%: <span style="color:#26a69a">'+fmt(tb)+'</span> / <span style="color:#ef5350">'+fmt(ta)+'</span></small><div class="bal"><i style="width:'+sh.toFixed(0)+'%"></i><u></u></div>';
  if(sm._h!==mh){sm.innerHTML=mh;sm._h=mh}
  $('#lcnt').textContent='шаг '+stp.toFixed(dec);
  const v=String(S.lg||0),g=$('#lgs');if(g.value!==v&&document.activeElement!==g)g.value=v;
}
