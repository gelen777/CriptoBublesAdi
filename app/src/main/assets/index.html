<script>
const $=s=>document.querySelector(s);
const HOSTS=[['https://api.binance.com','wss://stream.binance.com:9443'],['https://data-api.binance.vision','wss://data-stream.binance.vision'],['https://api-gcp.binance.com','wss://stream.binance.com:443']];
let hi=0,useWs=false;
/* REST может блокироваться (CORS/сеть), тогда те же запросы идут через WebSocket API Binance */
let wsa=null,wsaQ=[],wsaP=new Map(),wsaId=0;
function wsaOpen(){
  if(wsa&&wsa.readyState<=1)return wsa;
  const w=new WebSocket('wss://ws-api.binance.com:443/ws-api/v3');wsa=w;
  w.onopen=()=>{wsaQ.splice(0).forEach(m=>w.send(m))};
  w.onmessage=e=>{const m=JSON.parse(e.data),p=wsaP.get(m.id);if(!p)return;wsaP.delete(m.id);clearTimeout(p.t);m.status===200?p.ok(m.result):p.no(new Error('ws '+m.status))};
  w.onclose=()=>{wsaP.forEach(p=>{clearTimeout(p.t);p.no(new Error('ws closed'))});wsaP.clear();if(wsa===w)wsa=null};
  return w;
}
function wsaCall(method,params,ms){
  return new Promise((ok,no)=>{
    const id=String(++wsaId),msg=JSON.stringify({id,method,params}),w=wsaOpen();
    wsaP.set(id,{ok,no,t:setTimeout(()=>{wsaP.delete(id);no(new Error('ws timeout'))},ms||12000)});
    w.readyState===1?w.send(msg):wsaQ.push(msg);
  });
}
function firstMini(){
  return new Promise((ok,no)=>{
    const w=new WebSocket('wss://stream.binance.com:9443/ws/!miniTicker@arr'),t=setTimeout(()=>{try{w.close()}catch(e){}no(new Error('mini timeout'))},12000);
    w.onmessage=e=>{clearTimeout(t);w.close();ok(JSON.parse(e.data).map(x=>({symbol:x.s,lastPrice:x.c,openPrice:x.o,highPrice:x.h,lowPrice:x.l,quoteVolume:x.q,priceChangePercent:String((x.c/x.o-1)*100)})))};
    w.onerror=()=>{clearTimeout(t);no(new Error('mini error'))};
  });
}
async function viaWs(path){
  const u=new URL(path,'https://x'),q=Object.fromEntries(u.searchParams),n=u.pathname;
  if(n==='/api/v3/ticker/24hr'){try{return await wsaCall('ticker.24hr',{},30000)}catch(e){return firstMini()}}
  if(n==='/api/v3/klines')return wsaCall('klines',{symbol:q.symbol,interval:q.interval,limit:+q.limit});
  if(n==='/api/v3/depth')return wsaCall('depth',{symbol:q.symbol,limit:+q.limit});
  if(n==='/api/v3/ticker')return wsaCall('ticker',{symbol:q.symbol,windowSize:q.windowSize});
  throw new Error('no ws route');
}
async function bj(path){
  if(!useWs){
    for(let i=0;i<HOSTS.length;i++){const h=(hi+i)%HOSTS.length;
      try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);const r=await fetch(HOSTS[h][0]+path,{signal:c.signal});clearTimeout(t);if(r.ok){hi=h;return await r.json()}}catch(e){}}
    useWs=true;
  }
  try{return await viaWs(path)}catch(e){throw new Error('net')}
}
const STABLE=new Set(['USDCUSDT','FDUSDUSDT','TUSDUSDT','USDPUSDT','EURUSDT','DAIUSDT','USDEUSDT','XUSDUSDT']);
const DEF={tper:'24ч,12ч,4ч,1ч',tnat:true,tnl:14,tsz:1,tpos:null,tbl:true,view:'own',tf:'15m',minUsd:0,bucket:0.1,range:5,bids:true,asks:true};
let S={view:'own',tf:'15m',minUsd:0,bucket:0.1,range:5,bids:true,asks:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('cbw')||'{}'))}catch(e){}

/* ---------- BUBBLES ---------- */
const bc=$('#bc'),bx=bc.getContext('2d'),dpr=devicePixelRatio||1;
let W=innerWidth,H=innerHeight,coins=new Map(),cid=0;
function fit(){const r=$('#bw');W=r.clientWidth||innerWidth;H=r.clientHeight||innerHeight;bc.width=W*dpr;bc.height=H*dpr;bx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',fit);try{new ResizeObserver(fit).observe($('#bw'))}catch(e){}fit();

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const SCH={rg:{n:'Красный + Зелёный',up:[38,194,129],dn:[232,72,77]},bo:{n:'Синий + Оранжевый',up:[59,156,255],dn:[255,159,26]},py:{n:'Жёлтый + Фиолетовый',up:[255,213,74],dn:[165,107,255]}};

/* форматирование */
const cm=s=>s.replace('.',',');
const fp=p=>cm((+p).toFixed(p>=1000?2:p>=1?4:p>=.01?5:p>=.0001?6:8))+' $';
const fpc=x=>cm(String(+x.toFixed(2)))+'%';
const fsg=x=>(x>0?'+':'')+fpc(x);
const fmtM=(n,sh)=>{const r=(v,u)=>cm((+v.toFixed(v>=100?0:1)).toString())+u;return sh?('$'+(n>=1e9?r(n/1e9,'B'):n>=1e6?r(n/1e6,'M'):n>=1e3?r(n/1e3,'K'):Math.round(n))):(n>=1e9?r(n/1e9,' млрд $'):n>=1e6?r(n/1e6,' млн $'):n>=1e3?r(n/1e3,' тыс $'):Math.round(n)+' $')};
const setH=(el,h)=>{if(el&&el._h!==h){el.innerHTML=h;el._h=h}};

/* рыночные данные (рейтинг, капитализация, логотипы) */
let MK={},mkSum=0,mkMax=500;
function attachMk(c){const m=MK[c.n];if(m){c.mc=m.mc;c.rk=m.rk;c.img=m.img;c.nm=m.name}}
async function loadMarkets(){
  try{
    const all=[];
    for(const p of [1,2]){const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page='+p);if(!r.ok)break;all.push(...await r.json())}
    const m={};let sum=0;
    all.forEach(x=>{const k=String(x.symbol).toUpperCase();sum+=x.market_cap||0;if(!m[k])m[k]={mc:x.market_cap||0,rk:x.market_cap_rank,img:x.image,name:x.name}});
    if(Object.keys(m).length){MK=m;mkSum=sum;mkMax=Math.max(100,all.length);coins.forEach(attachMk)}
  }catch(e){}
  setTimeout(loadMarkets,600000);
}
const IMG=new Map();let imgBudget=0;
function logoOf(c){
  let e=IMG.get(c.n);
  if(!e){if(imgBudget<=0)return null;imgBudget--;e={im:new Image(),ok:false,t:0};
    e.im.onload=()=>{e.ok=true};
    e.im.onerror=()=>{if(!e.t&&c.img){e.t=1;e.im.src=c.img}};
    e.im.src='https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/32/color/'+c.n.toLowerCase()+'.png';IMG.set(c.n,e)}
  return e.ok?e.im:null;
}

async function initBubbles(){

  d.filter(t=>t.symbol.endsWith('USDT')&&!/(UP|DOWN|BULL|BEAR)USDT$/.test(t.symbol)&&+t.quoteVolume>50000)
   .forEach(t=>{const c={id:cid++,s:t.symbol,n:t.symbol.slice(0,-4),p:+t.lastPrice,o:+t.openPrice,vol:+t.quoteVolume,h:+t.highPrice,l:+t.lowPrice,st:STABLE.has(t.symbol),base:0,bp:'',bt:0,ch:0,mc:0,rk:0,x:W/2+(Math.random()-.5)*W*.6,y:H/2+(Math.random()-.5)*H*.6,vx:0,vy:0,r:6};attachMk(c);coins.set(t.symbol,c)});
  connectTicker();applyCfg();loadMarkets();

const mixc=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
function colOf(c,cf){
  const S2=SCH[AS.colors]||SCH.rg;
  if(cf.color==='neutral')return [110,135,175];
  if(cf.color==='rank'){let t=c.rk?Math.min(1,(c.rk-1)/mkMax):.5;if(cf.crev)t=1-t;return mixc(S2.up,S2.dn,t)}
  return c.ch>=0?S2.up:S2.dn;
}
function contentOf(c,cf){
  switch(cf.content){
    case 'mcap':return c.mc?fmtM(c.mc,1):'—';
    case 'vol':return fmtM(c.vol,1);
    case 'price':return fp(c.p).replace(' $','');
    case 'rank':return c.rk?'#'+c.rk:'—';
    case 'name':return c.nm&&c.nm!==c.n?c.nm:'';
    case 'dom':return c.mc&&mkSum?cm((c.mc/mkSum*100).toFixed(2))+'%':'—';
    default:return fsg(c.ch);
  }
}
const lm=(v,r)=>v>0&&r[1]>r[0]?(Math.log(v)-r[0])/(r[1]-r[0]):0;
function tickBubbles(){
  requestAnimationFrame(tickBubbles);
  if($('#bub').style.display==='none')return;
  const now=performance.now(),cf=cfg();
  if(now-visT>1500){visT=now;VIS=visible()}
  const a=VIS;bx.clearRect(0,0,W,H);imgBudget=12;
  if(!a.length||W<50||H<50)return;
  a.forEach(c=>c.ch=chg(c,cf));
  if(now-p95T>1500){p95T=now;
    const v=a.map(c=>Math.abs(c.ch)).sort((x,y)=>x-y);p95=Math.max(.01,v[Math.floor(v.length*.93)]||.01);
    const lg=k=>{const z=a.map(c=>c[k]).filter(x=>x>0);return z.length?[Math.log(Math.min(...z)),Math.log(Math.max(...z))]:[0,1]};LM={mc:lg('mc'),vol:lg('vol')}}
  const met=c=>{switch(cf.size){
    case 'rank':{const m=c.rk?1-(c.rk-1)/mkMax:0;return cf.srev?1-m:m}
    case 'mcap':return lm(c.mc,LM.mc);
    case 'vol':return lm(c.vol,LM.vol);
    default:return Math.min(Math.abs(c.ch)/p95,1)}};
  let A=0;a.forEach(c=>{c.rr=1+2.2*met(c);A+=Math.PI*c.rr*c.rr});
  const s=Math.sqrt(.64*W*H/A),rmax=Math.min(W,H)*.3;
  a.forEach(c=>{c.r+=(Math.min(rmax,c.rr*s)-c.r)*.08;c.vx+=(W/2-c.x)/W*.5;c.vy+=(H/2-c.y)/H*.5});
  const cs=Math.max(20,2*Math.max(...a.map(c=>c.r))+2),g=new Map();
  a.forEach(c=>{const k=Math.floor(c.x/cs)+','+Math.floor(c.y/cs);let l=g.get(k);if(!l){l=[];g.set(k,l)}l.push(c)});
  a.forEach(p=>{const cx=Math.floor(p.x/cs),cy=Math.floor(p.y/cs);
    for(let ix=-1;ix<=1;ix++)for(let iy=-1;iy<=1;iy++){const l=g.get((cx+ix)+','+(cy+iy));if(!l)continue;
      for(const q of l){if(q.id<=p.id)continue;
        let dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1,m=p.r+q.r+1.5;
        if(d<m){const f=(m-d)*.1;dx/=d;dy/=d;p.vx-=dx*f;p.vy-=dy*f;q.vx+=dx*f;q.vy+=dy*f}}}});
  a.forEach(c=>{
    c.vx*=.82;c.vy*=.82;c.x+=c.vx;c.y+=c.vy;
    c.x=Math.min(W-c.r,Math.max(c.r,c.x));c.y=Math.min(H-c.r,Math.max(c.r,c.y));
    const r=c.r,col=colOf(c,cf),rgb=col.join(','),st=cf.color==='perf'?Math.min(Math.abs(c.ch)/p95,1):.45;
    const gr=bx.createRadialGradient(c.x,c.y,r*.3,c.x,c.y,r);
    gr.addColorStop(0,'rgba('+rgb+',.03)');gr.addColorStop(1,'rgba('+rgb+','+(.16+.55*st)+')');
    bx.beginPath();bx.arc(c.x,c.y,r,0,6.2832);bx.fillStyle=gr;bx.fill();
    bx.strokeStyle='rgba('+rgb+','+(.5+.5*st)+')';bx.lineWidth=Math.max(1,r*.05);bx.stroke();
    if(r<8)return;
    const lg=logoOf(c);
    if(r<16){if(lg){const z=r*1.25;bx.drawImage(lg,c.x-z/2,c.y-z/2,z,z)}return}
    const big=r>=26,hasC=r>=20,fs=Math.min(Math.max(9,r*(big?.3:.34)),(r*1.7)/(Math.max(3,c.n.length)*.62)),ls=lg?r*(big?.6:.62):0;
    const th=ls+(lg?3:0)+fs*1.15*(hasC?2:1);let y0=c.y-th/2;
    if(lg){bx.drawImage(lg,c.x-ls/2,y0,ls,ls);y0+=ls+3}
    bx.fillStyle='#fff';bx.textAlign='center';bx.textBaseline='top';
    bx.font='700 '+fs+'px system-ui';bx.fillText(c.n,c.x,y0);
    if(hasC){bx.font='500 '+(fs*.78)+'px system-ui';bx.fillStyle='rgba(255,255,255,.85)';bx.fillText(contentOf(c,cf),c.x,y0+fs*1.15)}
  });
}

function parseRows(str){

    const m=t.toLowerCase().match(/^(\d+)(м|m|ч|h|д|d)$/);if(!m)return;
    const n=+m[1],u=m[2];let lab,w;
    if(u==='м'||u==='m'){if(n<1||n>59)return;w=n+'m';lab=n+'м'}
    else if(u==='ч'||u==='h'){if(n<1||n>168)return;lab=n+'ч';if(n<=23)w=n+'h';else if(n%24===0)w=(n/24)+'d';else return}
    else{if(n<1||n>7)return;w=n+'d';lab=n+'д'}

}

function calcWalls(now){

  const add=(book,side)=>book.forEach((q,p)=>{
    p=+p;if(p<lo||p>hi)return;
    const b=Math.floor(p/step)*step+step/2,key=side+Math.round(b/step);
    const o=m.get(key)||{key,p:b,usd:0,side,step,q:0};o.usd+=p*q;o.q+=q;m.set(key,o);
